<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rastreabilidade | Sustentabilidade</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- DataTables -->
  <link href="https://cdn.datatables.net/1.13.8/css/dataTables.bootstrap5.min.css" rel="stylesheet">
  <!-- Leaflet -->
  <link href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" rel="stylesheet">
  <!-- Estilo próprio -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- CABEÇALHO -->
  <header class="app-header">
    <div class="header-inner">
      <img src="assets/logo-datasquad.png" alt="Data Squad" class="logo">
      <div class="header-title">
        <h1>Rastreabilidade</h1>
        <span>Sustentabilidade</span>
      </div>
      <img src="assets/logo-ofi.png" alt="OFI" class="logo">
    </div>
  </header>

  <main class="container-fluid py-4">

    <!-- STATUS DE CARREGAMENTO -->
    <div id="loading" class="alert alert-info">Carregando dados...</div>
    <div id="error" class="alert alert-danger d-none"></div>

    <!-- CARDS -->
    <div class="row g-3 mb-4" id="cards">
      <div class="col-md-3 col-sm-6">
        <div class="card metric-card">
          <div class="card-body">
            <div class="metric-label">Volume das Notas</div>
            <div class="metric-value" id="card-volume">-</div>
          </div>
        </div>
      </div>
      <div class="col-md-3 col-sm-6">
        <div class="card metric-card">
          <div class="card-body">
            <div class="metric-label">Capacidade Produtiva</div>
            <div class="metric-value" id="card-cp">-</div>
          </div>
        </div>
      </div>
      <div class="col-md-3 col-sm-6">
        <div class="card metric-card">
          <div class="card-body">
            <div class="metric-label">Saldo Total</div>
            <div class="metric-value" id="card-saldo">-</div>
          </div>
        </div>
      </div>
      <div class="col-md-3 col-sm-6">
        <div class="card metric-card">
          <div class="card-body">
            <div class="metric-label">Produtores</div>
            <div class="metric-value" id="card-produtores">-</div>
          </div>
        </div>
      </div>
    </div>

    <!-- FILTROS -->
    <div class="card mb-4">
      <div class="card-body">
        <div class="row g-3">
          <div class="col-md-3">
            <label class="form-label">Fornecedor</label>
            <select id="filtro-fornecedor" class="form-select"></select>
          </div>
          <div class="col-md-3">
            <label class="form-label">Estado</label>
            <select id="filtro-estado" class="form-select"></select>
          </div>
          <div class="col-md-3">
            <label class="form-label">Filial</label>
            <select id="filtro-filial" class="form-select"></select>
          </div>
          <div class="col-md-3">
            <label class="form-label">Status</label>
            <select id="filtro-status" class="form-select"></select>
          </div>
        </div>
        <div class="mt-3">
          <button id="btn-limpar" class="btn btn-outline-secondary btn-sm">Limpar filtros</button>
        </div>
      </div>
    </div>

    <!-- MAPA + GRÁFICO -->
    <div class="row g-3 mb-3">
      <div class="col-lg-8">
        <div class="card h-100">
          <div class="card-body">
            <h5 class="card-subtitle mb-3">Volume por Estado</h5>
            <div id="mapa"></div>
          </div>
        </div>
      </div>
      <div class="col-lg-4">
        <div class="card h-100">
          <div class="card-body">
            <h5 class="card-subtitle mb-3">Status de Acompanhamento</h5>
            <canvas id="grafico-status"></canvas>
          </div>
        </div>
      </div>
    </div>

    <!-- TABELA -->
    <div class="row g-3">
      <div class="col-12">
        <div class="card">
          <div class="card-body">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <h5 class="card-subtitle mb-0">Registros</h5>
              <button id="btn-exportar" class="btn btn-exportar btn-sm">
                &#128229; Exportar para Excel
              </button>
            </div>
            <div class="table-responsive">
              <table id="tabela" class="table table-striped table-hover w-100">
                <thead>
                  <tr>
                    <th>Nome</th>
                    <th>Fornecedor</th>
                    <th>Estado</th>
                    <th>Filial</th>
                    <th>Status</th>
                    <th>Volume</th>
                    <th>CP</th>
                    <th>Saldo</th>
                  </tr>
                </thead>
                <tbody></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>

  </main>

  <!-- Bibliotecas -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.8/js/dataTables.bootstrap5.min.js"></script>

  <!-- Scripts próprios -->
  <script src="js/excel-reader.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/map.js"></script>
  <script src="js/export.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
